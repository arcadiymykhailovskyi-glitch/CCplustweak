name: Build Rootless Deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos and Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot zstd curl git

          # Клонируем Theos
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos

          # Качаем и ставим SDK
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          git clone https://github.com/theos/sdks.git $GITHUB_WORKSPACE/theos/sdks

          # Скачиваем официальный Linux-тулчейн Theos (компилятор clang под arm64)
          mkdir -p $GITHUB_WORKSPACE/theos/toolchain/linux
          curl -L -o /tmp/linux.tar.zst https://github.com/theos/toolchain/releases/download/v0.1-RC1/linux.tar.zst
          tar --zstd -xf /tmp/linux.tar.zst -C $GITHUB_WORKSPACE/theos/toolchain/linux

      - name: Build Tweak for Dopamine (Rootless)
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          export PATH="$THEOS/bin:$PATH"
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCPlus-deb
          path: packages/*.deb
