      - name: Setup Theos and Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot zstd git curl

          # Клонируем Theos
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          
          # Качаем и ставим SDK
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          git clone https://github.com/theos/sdks.git $GITHUB_WORKSPACE/theos/sdks

          # Правильный способ клонирования тулчейна для Linux через submodules или git clone в нужную папку
          mkdir -p $GITHUB_WORKSPACE/theos/toolchain/linux
          git clone https://github.com/theos/toolchain.git --branch linux --single-branch $GITHUB_WORKSPACE/theos/toolchain/linux || \
          git clone https://github.com/theos/toolchain.git $GITHUB_WORKSPACE/theos/toolchain/linux
