name: Build Rootless Deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos, SDK & Toolchain
        run: |
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          git clone https://github.com/theos/sdks.git $GITHUB_WORKSPACE/theos/sdks
          # Клонируем тулчейн компиляторов прямо в папку toolchain для linux
          git clone https://github.com/theos/toolchain:linux $GITHUB_WORKSPACE/theos/toolchain/linux || true

      - name: Build Tweak for Dopamine (Rootless)
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          export PATH="$THEOS/bin:$PATH"
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCPlus-deb
          path: packages/*.deb
