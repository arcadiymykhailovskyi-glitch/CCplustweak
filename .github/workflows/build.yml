name: Build Rootless Deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos and Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot curl git make zstd

          # Официальный установщик Theos (скачает сам Theos, тулчейн и базовый SDK в ~/theos)
          export THEOS=~/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true

          # Докачиваем полный набор актуальных SDK для гарантии
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks

      - name: Build Tweak for Dopamine (Rootless)
        run: |
          export THEOS=~/theos
          export PATH="$THEOS/bin:$PATH"
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCPlus-deb
          path: packages/*.deb
